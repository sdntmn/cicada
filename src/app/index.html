<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Долг — Минимализм (исправлено)</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #fff;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
      }

      .card {
        width: 100%;
        max-width: 420px;
        border: 1px solid #eaeaea;
        border-radius: 8px;
        overflow: hidden;
      }

      .card-header {
        padding: 14px 16px;
        font-size: 16px;
        font-weight: 600;
        color: #333;
        border-bottom: 1px solid #eaeaea;
      }

      .row {
        display: flex;
        align-items: center;
        padding: 12px 16px;
        border-bottom: 1px solid #f0f0f0;
        transition: background-color 0.15s ease;
      }

      .row:last-child {
        border-bottom: none;
      }

      .row:hover {
        background-color: #f9f9f9;
      }

      .icon {
        width: 18px;
        height: 18px;
        margin-right: 12px;
        color: #777;
        flex-shrink: 0;
      }

      .label {
        font-size: 14px;
        color: #666;
        font-weight: 500;
        min-width: 70px;
      }

      .value {
        font-size: 14px;
        color: #222;
        font-weight: 500;
        /* Левое выравнивание — как вы просили */
        text-align: left;
        flex-grow: 1;
      }

      .value.sum {
        color: #d32f2f;
        font-weight: 600;
      }

      .value.period {
        color: #888;
      }

      /* Стилизация SVG иконок */
      .icon svg {
        width: 100%;
        height: 100%;
        fill: currentColor;
      }
    </style>
  </head>
